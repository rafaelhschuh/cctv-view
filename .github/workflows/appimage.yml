name: AppImage

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install native and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake curl ca-certificates python3 file \
            libgtk-4-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libsecret-1-dev libpulse-dev \
            appstream desktop-file-utils adwaita-icon-theme hicolor-icon-theme \
            xvfb xauth dbus-x11

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: appimage-ubuntu-24.04

      - name: Fetch verified AppImage tools
        run: scripts/fetch-appimage-tools.sh

      - name: Build AppImage
        run: scripts/build-appimage.sh

      - name: Include project sources and build information
        run: |
          git archive --format=tar.gz --prefix=CCTV-View-source/ \
            HEAD > dist/CCTV-View-source.tar.gz
          {
            printf 'Source commit: '
            git rev-parse HEAD
            rustc --version
            cargo --version
            dpkg-query -W -f='${binary:Package}\t${Version}\n'
          } > dist/BUILD-INFO.txt
          cd dist
          sha256sum CCTV-View-x86_64.AppImage CCTV-View-source.tar.gz \
            BUILD-INFO.txt > SHA256SUMS

      - name: Verify CLI without a display
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY dist/CCTV-View-x86_64.AppImage --version
          env -u DISPLAY -u WAYLAND_DISPLAY dist/CCTV-View-x86_64.AppImage --help

      - name: Smoke test in an isolated display and library
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          CCTV_VIEW_SMOKE_MS: '1500'
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GTK_USE_PORTAL: '0'
        run: |
          set -euo pipefail
          cctv_smoke_dir=$(mktemp -d)
          trap 'rm -rf "$cctv_smoke_dir"' EXIT
          export CCTV_VIEW_DATA_DIR="$cctv_smoke_dir"
          timeout 45s xvfb-run -a dbus-run-session -- dist/CCTV-View-x86_64.AppImage \
            2>&1 | tee "$cctv_smoke_dir/smoke.log"
          if grep -E 'Gtk-WARNING|CRITICAL|panicked at' "$cctv_smoke_dir/smoke.log"; then
            exit 1
          fi
          cd dist
          sha256sum --check SHA256SUMS

      - name: Upload AppImage, checksum and project sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CCTV-View-x86_64
          path: |
            dist/CCTV-View-x86_64.AppImage
            dist/CCTV-View-source.tar.gz
            dist/BUILD-INFO.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: CCTV-View-x86_64
          path: dist

      - name: Check version and extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$version" != "$crate_version" ]]; then
            echo "Tag $TAG difere da versão do workspace ($crate_version)." >&2
            exit 1
          fi
          scripts/release-notes.sh "$version" > dist/RELEASE-NOTES.md
          cd dist
          sha256sum --check SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CCTV View ${TAG#v}" --notes-file dist/RELEASE-NOTES.md \
            dist/CCTV-View-x86_64.AppImage dist/SHA256SUMS \
            dist/CCTV-View-source.tar.gz dist/BUILD-INFO.txt
