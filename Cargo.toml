[workspace]
members = ["crates/app", "crates/core", "crates/media", "crates/onvif", "crates/storage", "crates/ui"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
tracing = "0.1"
cctv-core = { path = "crates/core" }
cctv-storage = { path = "crates/storage" }
cctv-media = { path = "crates/media" }
cctv-onvif = { path = "crates/onvif" }
cctv-ui = { path = "crates/ui" }
[profile.release]
lto = "thin"
strip = true
