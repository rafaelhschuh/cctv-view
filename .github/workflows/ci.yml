name: Rust and native integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev libsecret-1-dev libpulse-dev xvfb dbus-x11 ffmpeg openssl gnome-keyring pulseaudio appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: xvfb-run -a scripts/test-ui.sh
      - run: scripts/test-protocols.sh
      - run: scripts/test-native-services.sh
      - run: cargo build --release --locked
      - name: Audit dependencies
        run: cargo install cargo-audit --locked && cargo audit
